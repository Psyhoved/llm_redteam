; Phase 1 long-running services (user-level, no root).
; Start:  ./scripts/supervisor_start.sh
; Control: ./scripts/supervisor_ctl.sh status|restart|stop|tail

[unix_http_server]
file=%(here)s/../../logs/supervisor/supervisor.sock

[supervisord]
logfile=%(here)s/../../logs/supervisor/supervisord.log
pidfile=%(here)s/../../logs/supervisor/supervisord.pid
childlogdir=%(here)s/../../logs/supervisor
directory=%(here)s/../..
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../../logs/supervisor/supervisor.sock

[program:phase1_admin]
command=/bin/bash %(here)s/../../scripts/run_service_with_env.sh run_phase1_admin.sh
directory=%(here)s/../..
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=15
stdout_logfile=%(here)s/../../logs/supervisor/phase1_admin.log
stderr_logfile=%(here)s/../../logs/supervisor/phase1_admin.err.log

[program:inspect_view]
command=/bin/bash %(here)s/../../scripts/run_service_with_env.sh run_inspect_view.sh
directory=%(here)s/../..
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=15
stdout_logfile=%(here)s/../../logs/supervisor/inspect_view.log
stderr_logfile=%(here)s/../../logs/supervisor/inspect_view.err.log

[program:lms_guard]
command=/bin/bash %(here)s/../../scripts/run_lms_guard_watchdog.sh
directory=%(here)s/../..
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=30
stdout_logfile=%(here)s/../../logs/supervisor/lms_guard.log
stderr_logfile=%(here)s/../../logs/supervisor/lms_guard.err.log

[group:phase1_services]
programs=phase1_admin,inspect_view,lms_guard
priority=999
