<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phase 1 Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header>
    <nav>
      <strong>Phase 1 Admin</strong>
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Новый прогон</a>
      <a href="/runs" {% if request.url.path.startswith("/runs") %}class="active"{% endif %}>Прогоны</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
